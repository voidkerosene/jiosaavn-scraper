name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: go build -trimpath -o bin/jiosaavn-scraper .
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jiosaavn-scraper
          path: bin/jiosaavn-scraper
